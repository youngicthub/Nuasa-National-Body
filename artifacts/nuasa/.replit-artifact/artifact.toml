kind = "web"
previewPath = "/"
title = "NUASA"
description = "NUASA National Body E-Library & Blog — a full-stack platform for Nigerian accounting students with resources, blog posts, convention registration, and chapter management."
version = "1.0.0"
id = "artifacts/nuasa"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21844

[services.development]
run = "npm --prefix /home/runner/workspace/artifacts/nuasa run build && PORT=21844 BASE_PATH=/ npm --prefix /home/runner/workspace/artifacts/nuasa run serve"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nuasa", "run", "build" ]
serve = "static"
publicDir = "artifacts/nuasa/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21844"
BASE_PATH = "/"
